name = "mahkamat-extract"
main = "index.js"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

[vars]
# Comma-separated origins allowed to call the Worker (GitHub Pages URL goes here after publishing).
ALLOWED_ORIGINS = "https://awadmustafa764-web.github.io"
# Preferred model; if this key cannot use it, the Worker picks the newest available "gemini-*-flash".
GEMINI_MODEL = ""

# The key is NOT here. Set it once with:  npx wrangler secret put GEMINI_API_KEY

# Results already read, keyed by the SHA-256 of the PDF the reader received: a repeat upload costs no Gemini quota.
[[kv_namespaces]]
binding = "EXTRACT_CACHE"
id = "3957a97b5c734342a1cb6d428901d400"
